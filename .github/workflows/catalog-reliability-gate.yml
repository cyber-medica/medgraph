name: Catalog reliability gate

on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read

jobs:
  fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright-core install --with-deps webkit
      - run: npm run qa:catalog-reliability-gate
      - run: npm run qa:runtime-artifact-permissions
      - run: npm run build
      - run: |
          set -euo pipefail
          server_log="${RUNNER_TEMP}/catalog-reliability-next.log"
          state_root="${RUNNER_TEMP}/cybermedica-next-runtime"
          build_id="$(tr -d '\r\n' < "${GITHUB_WORKSPACE}/.next/BUILD_ID")"
          node_bin="$(command -v node)"
          runner_user="$(id -un)"
          runner_group="$(id -gn)"
          sudo env "PATH=$PATH" "$node_bin" \
            scripts/release/runtime-artifact-permissions.mjs \
            prepare-state \
            --root "$GITHUB_WORKSPACE" \
            --state-root "$state_root" \
            --user "$runner_user" \
            --group "$runner_group"
          test -d "${state_root}/${build_id}"
          test -r "${state_root}/${build_id}"
          test -w "${state_root}/${build_id}"
          test -x "${state_root}/${build_id}"
          echo "FIRST_SMOKE_BUILD_ID=${build_id}"
          echo "FIRST_SMOKE_STATE_ROOT=${state_root}"
          echo "FIRST_SMOKE_STATE_PREPARED=YES"
          : > "$server_log"
          CATALOG_DATA_SOURCE=cloud_published \
          CYBERMEDICA_SUPABASE_PROJECT_REF=gjlpkqdhlzbfnzzoxlsk \
          CYBERMEDICA_SUPABASE_URL=https://gjlpkqdhlzbfnzzoxlsk.supabase.co \
          SUPABASE_SECRET_KEY=sb_secret_fault_injection_only_000000000000 \
          VERCEL=1 \
          VERCEL_ENV=preview \
          CYBERMEDICA_NEXT_RUNTIME_STATE_ROOT="$state_root" \
          CYBERMEDICA_CATALOG_FAULT_INJECTION=all npm start >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            sudo rm -rf "$state_root"
          }
          trap cleanup EXIT
          echo "PROCESS_CREATED=YES"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/catalog >/dev/null; then
              echo "LISTENER_CREATED=YES"
              WEBKIT_SMOKE_PRODUCT_PATH=/catalog/767632362-330695211247-apparat-ivl-hamilton-t1 \
              WEBKIT_SMOKE_REMOTE_MEDIA_MODE=fixture \
              WEBKIT_SMOKE_REQUIRE_REMOTE_MEDIA_INTERCEPTION=1 \
              WEBKIT_SMOKE_ASSERT_NO_SUPABASE=1 \
              npm run qa:ios-webkit-smoke
              WEBKIT_SMOKE_MODE=next-image \
              WEBKIT_SMOKE_NEXT_IMAGE_TIMEOUT_MS=8000 \
              WEBKIT_SMOKE_SERVER_LOG="$server_log" \
              npm run qa:ios-webkit-smoke
              if grep -q 'ENOENT' "$server_log"; then
                echo "Unexpected ENOENT in first startup server log." >&2
                exit 1
              fi
              echo "CACHE_HANDLER_INIT=PASS"
              echo "ENOENT=0"
              echo "CATALOG_HTTP=200"
              echo "FIRST_STARTUP_SMOKE=PASS"
              exit 0
            fi
            sleep 1
          done
          catalog_http="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3000/catalog || true)"
          echo "SERVER_LOG"
          cat "$server_log"
          echo "HTTP_STATUS=${catalog_http:-000}"
          if kill -0 "$server_pid" 2>/dev/null; then
            echo "PROCESS_STATE=RUNNING"
            ps -p "$server_pid" -o pid=,ppid=,user=,stat=,command= || true
          else
            echo "PROCESS_STATE=EXITED"
          fi
          echo "LISTENER_STATE"
          sudo ss -ltnp 'sport = :3000' || true
          echo "BUILD_ID=${build_id}"
          if [[ -d "${state_root}/${build_id}" ]]; then
            echo "RUNTIME_STATE_ROOT=EXISTS"
            stat -c 'RUNTIME_STATE_MODE=%a RUNTIME_STATE_OWNER=%U:%G' \
              "${state_root}/${build_id}" || true
          else
            echo "RUNTIME_STATE_ROOT=MISSING"
          fi
          exit 1
      - name: Verify immutable runtime as cybermedica-web
        shell: bash
        run: |
          set -euo pipefail

          service_user="cybermedica-web"
          release_root="/opt/cybermedica-ci-release"
          runtime_helper="${release_root}/scripts/release/runtime-artifact-permissions.mjs"
          state_root="/var/lib/cybermedica-web/next-runtime"
          inventory_before="${RUNNER_TEMP}/cybermedica-runtime-inventory.json"
          server_log="${RUNNER_TEMP}/cybermedica-web-next.log"
          port="3011"
          node_bin="$(command -v node)"
          npm_bin="$(command -v npm)"
          server_pid=""

          cleanup() {
            if [[ -n "$server_pid" ]]; then
              sudo kill "$server_pid" 2>/dev/null || true
            fi
            sudo pkill -TERM -u "$service_user" 2>/dev/null || true
            sudo rm -rf "$release_root" "$state_root"
            sudo userdel "$service_user" 2>/dev/null || true
          }
          trap cleanup EXIT

          if id "$service_user" >/dev/null 2>&1; then
            echo "Refusing to reuse a pre-existing ${service_user} account." >&2
            exit 1
          fi
          sudo useradd \
            --system \
            --no-create-home \
            --home-dir /nonexistent \
            --shell /usr/sbin/nologin \
            "$service_user"
          test "$(id -un "$(id -u "$service_user")")" = "$service_user"
          echo "USER_EXISTS=${service_user}"

          sudo mkdir -p "$release_root"
          sudo rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env*' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='.next/cache/' \
            --exclude='.next/diagnostics/' \
            --exclude='node_modules/next/dist/docs/' \
            "${GITHUB_WORKSPACE}/" "$release_root/"
          test -r "$runtime_helper"
          sudo env "PATH=$PATH" "$node_bin" \
            "$runtime_helper" \
            normalize --root "$release_root"
          sudo chown -R root:root "$release_root"
          sudo -u "$service_user" test -r "$runtime_helper"
          sudo -u "$service_user" test -x "$release_root"
          if sudo -u "$service_user" test -w "$release_root"; then
            echo "Prepared release tree is unexpectedly writable by ${service_user}." >&2
            exit 1
          fi
          echo "HELPER_PATH_INSIDE_RELEASE=${runtime_helper}"
          echo "HELPER_PRESENT_IN_RELEASE=YES"
          echo "HELPER_RESOLUTION_FROM_RELEASE=PASS"

          cd "$release_root"

          sudo env "PATH=$PATH" RUNTIME_ROOT="$release_root" INVENTORY_PATH="$inventory_before" \
            "$node_bin" --input-type=module --eval '
              import { writeFile } from "node:fs/promises";
              import { createRuntimeInventory } from "./scripts/release/runtime-artifact-permissions.mjs";
              const inventory = await createRuntimeInventory(process.env.RUNTIME_ROOT);
              await writeFile(process.env.INVENTORY_PATH, `${JSON.stringify(inventory)}\n`, { mode: 0o600 });
            '

          sudo env "PATH=$PATH" "$node_bin" \
            "$runtime_helper" \
            prepare-state \
            --root "$release_root" \
            --state-root "$state_root" \
            --user "$service_user" \
            --group "$service_user"
          sudo env "PATH=$PATH" "$node_bin" \
            "$runtime_helper" \
            service-audit \
            --root "$release_root" \
            --state-root "$state_root" \
            --user "$service_user" \
            --group "$service_user"
          echo "SERVICE_USER_CAN_READ_RELEASE=YES"
          echo "SERVICE_USER_CAN_TRAVERSE_RELEASE=YES"
          echo "SERVICE_USER_CAN_WRITE_RUNTIME_STATE=YES"
          echo "SERVICE_USER_CANNOT_WRITE_IMMUTABLE_RELEASE=YES"

          build_id="$(tr -d '\r\n' < "$release_root/.next/BUILD_ID")"
          build_state="${state_root}/${build_id}"
          fetch_cache_root="${build_state}/cache/fetch-cache"
          fetch_files_before=0
          if [[ -d "$fetch_cache_root" ]]; then
            fetch_files_before="$(sudo find "$fetch_cache_root" -type f -print | wc -l | tr -d ' ')"
          fi
          test "$fetch_files_before" = "0"
          echo "FETCH_CACHE_FILES_BEFORE=0"

          : > "$server_log"
          sudo -u "$service_user" env \
            "PATH=$PATH" \
            HOME=/nonexistent \
            NODE_ENV=production \
            CATALOG_DATA_SOURCE=cloud_published \
            CYBERMEDICA_SUPABASE_PROJECT_REF=gjlpkqdhlzbfnzzoxlsk \
            CYBERMEDICA_SUPABASE_URL=https://gjlpkqdhlzbfnzzoxlsk.supabase.co \
            SUPABASE_SECRET_KEY=sb_secret_fault_injection_only_000000000000 \
            CYBERMEDICA_CATALOG_FAULT_INJECTION=all \
            CYBERMEDICA_NEXT_RUNTIME_STATE_ROOT="$state_root" \
            "$npm_bin" start -- --hostname 127.0.0.1 --port "$port" >"$server_log" 2>&1 &
          server_pid=$!

          ready="NO"
          for attempt in $(seq 1 45); do
            if curl --fail --silent "http://127.0.0.1:${port}/catalog" >/dev/null; then
              ready="YES"
              break
            fi
            sleep 1
          done
          test "$ready" = "YES"
          pgrep -u "$service_user" -f 'next' >/dev/null
          echo "NEXT_START_AS_CYBERMEDICA_WEB=PASS"

          fetch_created="NO"
          fetch_files=()
          for attempt in $(seq 1 30); do
            if [[ -d "$fetch_cache_root" ]]; then
              mapfile -t fetch_files < <(sudo find "$fetch_cache_root" -type f -print | sort)
            fi
            if [[ "${#fetch_files[@]}" -gt 0 ]]; then
              fetch_created="YES"
              break
            fi
            sleep 1
          done
          test "$fetch_created" = "YES"
          fetch_entry="${fetch_files[0]}"
          fetch_entry_relative="${fetch_entry#${build_state}/}"
          fetch_digest_before="$(sudo sha256sum "$fetch_entry" | awk '{print $1}')"
          fetch_mtime_before="$(sudo stat -c '%Y' "$fetch_entry")"
          echo "FETCH_CACHE_CREATED=YES"
          echo "FETCH_CACHE_ENTRY=${fetch_entry_relative}"
          echo "FETCH_CACHE_DIGEST_BEFORE=${fetch_digest_before}"
          echo "FETCH_CACHE_WRITE=PASS"

          home_http="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/")"
          catalog_http="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/catalog")"
          hamilton_http="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://127.0.0.1:${port}/catalog/767632362-330695211247-apparat-ivl-hamilton-t1")"
          test "$home_http" = "200"
          test "$catalog_http" = "200"
          test "$hamilton_http" = "200"
          echo "HOME_HTTP=${home_http}"
          echo "CATALOG_HTTP=${catalog_http}"
          echo "HAMILTON_HTTP=${hamilton_http}"

          image_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --get \
            --data-urlencode 'url=/brand/cybermedica-logo.png' \
            --data 'w=64' \
            --data 'q=75' \
            "http://127.0.0.1:${port}/_next/image")"
          test "$image_status" = "200"

          mapfile -t image_metadata < <(sudo find "$build_state/images-v1" -type f -name metadata.json -print | sort)
          mapfile -t image_payloads < <(sudo find "$build_state/images-v1" -type f -name payload.bin -print | sort)
          test "${#image_metadata[@]}" -gt 0
          test "${#image_payloads[@]}" -gt 0
          for metadata_path in "${image_metadata[@]}"; do
            sudo test -f "$(dirname "$metadata_path")/payload.bin"
          done
          echo "IMAGE_CACHE_METADATA_CREATED=YES"
          echo "IMAGE_CACHE_PAYLOAD_CREATED=YES"
          echo "IMAGE_CACHE_WRITE=PASS"

          fetch_digest_before="$(sudo sha256sum "$fetch_entry" | awk '{print $1}')"
          fetch_mtime_before="$(sudo stat -c '%Y' "$fetch_entry")"
          echo "FETCH_CACHE_DIGEST_BEFORE_REVALIDATION=${fetch_digest_before}"
          echo "FETCH_CACHE_MTIME_BEFORE_REVALIDATION=${fetch_mtime_before}"
          sleep 65
          revalidation_path="/catalog/767632362-330695211247-apparat-ivl-hamilton-t1"
          revalidation_http="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://127.0.0.1:${port}${revalidation_path}")"
          test "$revalidation_http" = "200"
          fetch_revalidated="NO"
          fetch_digest_after="$fetch_digest_before"
          fetch_mtime_after="$fetch_mtime_before"
          for attempt in $(seq 1 30); do
            fetch_digest_after="$(sudo sha256sum "$fetch_entry" | awk '{print $1}')"
            fetch_mtime_after="$(sudo stat -c '%Y' "$fetch_entry")"
            if [[ "$fetch_mtime_after" != "$fetch_mtime_before" \
              || "$fetch_digest_after" != "$fetch_digest_before" ]]; then
              fetch_revalidated="YES"
              break
            fi
            sleep 1
          done
          test "$fetch_revalidated" = "YES"
          echo "FETCH_CACHE_REVALIDATED=YES"
          echo "FETCH_CACHE_DIGEST_AFTER=${fetch_digest_after}"
          echo "FETCH_CACHE_MTIME_AFTER=${fetch_mtime_after}"
          echo "FETCH_CACHE_REVALIDATION=PASS"

          sudo pkill -TERM -u "$service_user" 2>/dev/null || true
          sudo kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          server_pid=""

          if grep -q 'EACCES' "$server_log"; then
            echo "Unexpected EACCES in named-user server log." >&2
            exit 1
          fi
          echo "EACCES=0"
          if grep -q 'MODULE_NOT_FOUND' "$server_log"; then
            echo "Unexpected MODULE_NOT_FOUND in named-user server log." >&2
            exit 1
          fi
          echo "MODULE_NOT_FOUND=0"

          sudo -u "$service_user" env \
            "PATH=$PATH" \
            NEXT_PHASE=phase-production-server \
            CYBERMEDICA_NEXT_RUNTIME_STATE_ROOT="$state_root" \
            RELEASE_ROOT="$release_root" \
            BUILD_STATE="$build_state" \
            "$node_bin" --input-type=commonjs --eval '
              const { access, readFile } = require("node:fs/promises");
              const { join } = require("node:path");
              const RuntimeCacheHandler = require(join(
                process.env.RELEASE_ROOT,
                "lib/runtime/next-runtime-cache-handler.cjs",
              ));
              const required = (condition, message) => {
                if (!condition) throw new Error(message);
              };
              (async () => {
                const handler = new RuntimeCacheHandler({
                  flushToDisk: true,
                  serverDistDir: join(process.env.RELEASE_ROOT, ".next/server"),
                  maxMemoryCacheSize: 0,
                  revalidatedTags: [],
                  _requestHeaders: {},
                });
                const key = "/__ci-app-page-probe";
                const context = { kind: "APP_PAGE", isFallback: false, isRoutePPREnabled: false };
                await handler.set(key, {
                  kind: "APP_PAGE",
                  html: "<main>external app page</main>\n",
                  rscData: Buffer.from("external-rsc\n"),
                  headers: {},
                  postponed: undefined,
                  status: 200,
                  segmentData: new Map([["/_tree", Buffer.from("external-segment\n")]]),
                }, context);
                const stored = await handler.get(key, context);
                required(stored?.value?.html === "<main>external app page</main>\n", "APP_PAGE HTML read-back failed.");
                required(stored?.value?.rscData?.toString("utf8") === "external-rsc\n", "APP_PAGE RSC read-back failed.");
                required(
                  stored?.value?.segmentData?.get("/_tree")?.toString("utf8") === "external-segment\n",
                  "APP_PAGE segment read-back failed.",
                );
                const externalRoot = join(process.env.BUILD_STATE, "server/app");
                const html = await readFile(join(externalRoot, "__ci-app-page-probe.html"), "utf8");
                const rsc = await readFile(join(externalRoot, "__ci-app-page-probe.rsc"), "utf8");
                const meta = JSON.parse(await readFile(join(externalRoot, "__ci-app-page-probe.meta"), "utf8"));
                const segment = await readFile(
                  join(externalRoot, "__ci-app-page-probe.segments/_tree.segment.rsc"),
                  "utf8",
                );
                required(html === "<main>external app page</main>\n", "External APP_PAGE HTML mismatch.");
                required(rsc === "external-rsc\n", "External APP_PAGE RSC mismatch.");
                required(meta.segmentPaths?.includes("/_tree"), "External APP_PAGE metadata missing segment path.");
                required(segment === "external-segment\n", "External APP_PAGE segment mismatch.");
                let immutableProbeExists = true;
                try {
                  await access(join(process.env.RELEASE_ROOT, ".next/server/app/__ci-app-page-probe.html"));
                } catch {
                  immutableProbeExists = false;
                }
                required(!immutableProbeExists, "Synthetic APP_PAGE write reached immutable release.");
                console.log("APP_PAGE_HANDLER_HTML=PASS");
                console.log("APP_PAGE_HANDLER_RSC=PASS");
                console.log("APP_PAGE_HANDLER_META=PASS");
                console.log("APP_PAGE_HANDLER_SEGMENTS=PASS");
              })().catch((error) => {
                console.error(error instanceof Error ? error.message : String(error));
                process.exit(1);
              });
            '

          sudo env "PATH=$PATH" "$node_bin" \
            "$runtime_helper" \
            service-audit \
            --root "$release_root" \
            --state-root "$state_root" \
            --user "$service_user" \
            --group "$service_user"

          sudo env "PATH=$PATH" RUNTIME_ROOT="$release_root" INVENTORY_PATH="$inventory_before" \
            "$node_bin" --input-type=module --eval '
              import { readFile } from "node:fs/promises";
              import { verifyRuntimeInventory } from "./scripts/release/runtime-artifact-permissions.mjs";
              const inventory = JSON.parse(await readFile(process.env.INVENTORY_PATH, "utf8"));
              const report = await verifyRuntimeInventory(process.env.RUNTIME_ROOT, inventory);
              console.log(`IMMUTABLE_RUNTIME_INVENTORY=${report.pass ? "PASS" : "FAIL"}`);
              if (report.pass) console.log("IMMUTABLE_FILES_CHANGED=0");
              if (!report.pass) {
                console.error(JSON.stringify(report));
                process.exit(1);
              }
            '

          if sudo find "$release_root" "$build_state" -perm -0002 -print -quit | grep -q .; then
            echo "World-writable runtime entry detected." >&2
            exit 1
          fi
          if sudo find "$release_root" \( ! -user root -o ! -group root \) -print -quit | grep -q .; then
            echo "Immutable release ownership drift detected." >&2
            exit 1
          fi
          echo "WORLD_WRITABLE_ENTRIES=0"
          echo "WORLD_WRITABLE_PATHS=0"
          echo "NAMED_USER_RUNTIME_GATE=PASS"
          echo "NAMED_USER_GATE=PASS"
  canonical-route-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: fault-injection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve the canonical runtime release
        id: runtime-release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
            && git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- . ':(exclude).github/**'; then
            echo "sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for the exact canonical Git release
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.runtime-release.outputs.sha }}
          EXPECTED_PUBLISHED_PRODUCT_COUNT: "114"
        run: |
          for attempt in $(seq 1 40); do
            if npm run qa:canonical-routing-gate; then
              exit 0
            fi
            sleep 15
          done
          exit 1
