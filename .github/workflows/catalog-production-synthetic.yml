name: Catalog production synthetic

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-production-synthetic
  cancel-in-progress: true

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check production full-GET availability
        run: npm run qa:production-availability

  synthetic:
    needs: availability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --user 1001
    env:
      CYBERMEDICA_MONITOR_OWNER: cybermedicaooo@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: EXPECTED_PUBLISHED_PRODUCT_COUNT=114 npm run qa:canonical-routing-gate
      - run: npm run qa:canonical-routing-mobile
