name: Catalog production synthetic

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-production-synthetic
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CYBERMEDICA_MONITOR_OWNER: cybermedicaooo@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright-core install --with-deps webkit
      - run: EXPECTED_PUBLISHED_PRODUCT_COUNT=71 npm run qa:canonical-routing-gate
      - run: npm run qa:canonical-routing-mobile
