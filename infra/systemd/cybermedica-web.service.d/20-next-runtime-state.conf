# Canonical CyberMedica web sandbox policy.
# Reset inherited release-specific writable paths before adding the one stable
# runtime-state root used by the external Next.js cache handler.
[Service]
User=cybermedica-web
Group=cybermedica-web
ProtectSystem=strict
ReadOnlyPaths=/opt/cybermedica-web
ReadWritePaths=
ReadWritePaths=/var/lib/cybermedica-web/next-runtime
